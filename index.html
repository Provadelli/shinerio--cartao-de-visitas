<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shine Rio Group | Cartão Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <div class="card" id="card">

    <!-- Background illustration (bay of Rio, mountains, clouds) -->
    <div class="bg-photo">
      <svg viewBox="0 0 430 932" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7c8f92"/>
            <stop offset="45%" stop-color="#9aa79c"/>
            <stop offset="100%" stop-color="#b9c2ad"/>
          </linearGradient>
          <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9fb0ae"/>
            <stop offset="100%" stop-color="#7f948f"/>
          </linearGradient>
          <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5f7570"/>
            <stop offset="100%" stop-color="#546a63"/>
          </linearGradient>
          <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#33453e"/>
            <stop offset="100%" stop-color="#212f2a"/>
          </linearGradient>
        </defs>

        <rect x="0" y="0" width="430" height="932" fill="url(#skyGrad)"/>

        <!-- clouds -->
        <g opacity="0.55" fill="#e7ece2">
          <ellipse cx="90" cy="230" rx="150" ry="26"/>
          <ellipse cx="260" cy="260" rx="180" ry="20"/>
          <ellipse cx="360" cy="210" rx="120" ry="18"/>
          <ellipse cx="140" cy="330" rx="200" ry="16"/>
        </g>

        <!-- sea -->
        <rect x="0" y="560" width="430" height="180" fill="url(#seaGrad)"/>
        <g stroke="#8fa39d" stroke-width="1" opacity="0.4">
          <line x1="0" y1="590" x2="430" y2="590"/>
          <line x1="0" y1="610" x2="430" y2="608"/>
          <line x1="0" y1="632" x2="430" y2="628"/>
        </g>

        <!-- far mountains -->
        <path d="M0,560 L40,470 90,520 150,440 210,510 270,455 330,515 390,460 430,530 430,600 0,600 Z" fill="url(#mtnFar)" opacity="0.85"/>

        <!-- Sugarloaf-like near mountains -->
        <path d="M280,600 C300,520 330,470 370,455 C400,445 420,470 430,500 L430,650 280,650 Z" fill="url(#mtnNear)"/>
        <path d="M0,650 C30,560 70,500 120,470 C160,448 190,470 210,510 C225,540 230,580 220,650 Z" fill="url(#mtnNear)"/>

        <!-- foreground rock left -->
        <path d="M0,932 L0,700 C10,660 40,630 70,650 C90,662 95,700 80,730 C60,770 20,800 0,820 Z" fill="#1c2c26"/>

        <!-- city + reflections -->
        <g fill="#4c5c53" opacity="0.5">
          <rect x="330" y="700" width="14" height="40"/>
          <rect x="350" y="690" width="10" height="50"/>
          <rect x="365" y="705" width="16" height="35"/>
        </g>

        <!-- foliage bottom -->
        <path d="M0,932 L0,830 C60,790 130,830 190,800 C250,772 300,800 340,780 C380,762 410,800 430,790 L430,932 Z" fill="#1a2b22"/>
      </svg>
    </div>
    <div class="bg-scrim"></div>

    <!-- Top teal curve -->
    <svg class="top-curve" viewBox="0 0 430 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0f6b5f"/>
          <stop offset="100%" stop-color="#159c7f"/>
        </linearGradient>
      </defs>
      <path d="M0,0 L430,0 L430,150 C 330,230 120,230 0,150 Z" fill="url(#topGrad)"/>
    </svg>

    <!-- Bottom teal curve -->
    <svg class="bottom-curve" viewBox="0 0 430 340" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="botGrad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#0f6b5f"/>
          <stop offset="100%" stop-color="#159c7f"/>
        </linearGradient>
      </defs>
      <path d="M0,340 L0,140 C 140,50 250,230 430,120 L430,340 Z" fill="url(#botGrad)"/>
      <path d="M430,340 L430,220 C 380,190 400,270 340,340 Z" fill="#dcefec"/>
    </svg>

    <div class="content">

      <!-- Circular badge / logo -->
      <div class="badge-wrap" id="badgeBtn" role="button" tabindex="0" aria-label="Shine Rio Group - site oficial">
        <div class="badge">
          <img class="badge-photo" src="assets/perfil-shinerio.jpeg" alt="Shine Rio Group">
        </div>
      </div>

      <div class="spacer"></div>

      <!-- Action buttons -->
      <div class="actions">

        <div class="sector-select-wrap">
          <button class="action-btn sector-trigger" id="sectorTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="icon-circle">
              <svg viewBox="0 0 24 24"><path d="M4 7h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" stroke-width="2" stroke-linejoin="round"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" stroke-width="2"/></svg>
            </span>
            <span class="action-label" id="sectorLabel">SETOR OPERACIONAL</span>
            <span class="chevron" id="sectorChevron">
              <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </button>

          <ul class="sector-dropdown" id="sectorDropdown" role="listbox" aria-label="Selecionar setor">
            <li role="option" data-sector="supervisao" aria-selected="true">Setor Operacional</li>
            <li role="option" data-sector="comercial-privado">Comercial Privado</li>
            <li role="option" data-sector="comercial-publico">Comercial Público</li>
            <li role="option" data-sector="dp">Departamento Pessoal</li>
            <li role="option" data-sector="rh">Recursos Humanos</li>
          </ul>
        </div>

        <a class="action-btn" href="#" id="whatsappBtn" target="_blank" rel="noopener">
          <span class="icon-circle">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z" stroke-width="2" stroke-linejoin="round"/><path d="M8.3 8.7c-.2.9.2 2 1.4 3.2 1.2 1.2 2.3 1.6 3.2 1.4.5-.1 1-.6 1.2-1.1l-1.7-1.2-.9.8c-.6-.3-1.1-.7-1.6-1.2-.5-.5-.9-1-1.2-1.6l.8-.9-1.2-1.7c-.5.2-1 .7-1.1 1.2z" fill="#fff" stroke="none"/></svg>
          </span>
          <span class="action-label" id="whatsappLabel">(21) 00000-0000</span>
        </a>

        <a class="action-btn" href="#" id="emailBtn">
          <span class="icon-circle">
            <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z" stroke-width="2" stroke-linejoin="round"/><path d="M3 7l9 6 9-6" stroke-width="2" stroke-linejoin="round"/></svg>
          </span>
          <span class="action-label" id="emailLabel">SUPERVISAO@SHINERIO.COM</span>
        </a>

        <a class="action-btn" href="#" id="instaBtn" target="_blank" rel="noopener">
          <span class="icon-circle">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.1" fill="#fff" stroke="none"/></svg>
          </span>
          <span class="action-label" id="instaLabel">@SHINERIO.GROUP</span>
        </a>

      </div>
    </div>

    <!-- Footer logo -->
    

  </div>
</div>

<!-- Toast feedback -->
<div class="toast" id="toast"></div>

<script src="script.js"></script>

</body>
</html>
