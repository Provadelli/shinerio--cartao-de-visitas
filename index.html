<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/perfil-shinerio.jpeg">
<title>Shine Rio Group | Cartão Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="stage">
  <div class="card" id="card">

    <!-- Background illustration (bay of Rio, mountains, clouds) -->
    <div class="bg-photo">
      <svg viewBox= preserveAspectRatio = "xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        

        <rect x="0" y="0" width="430" height="932" fill="url(#skyGrad)"/>

        
        <!-- foliage bottom -->
       
      </svg>
    </div>
    <div class="bg-scrim"></div>

    <!-- Top teal curve -->
    

    <!-- Bottom teal curve -->
    <svg class="bottom-curve" viewBox="0 0 430 340" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="botGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1F7FB7"/>
          <stop offset="20%" stop-color="#2189B1"/>
          <stop offset="45%" stop-color="#20989D"/>
          <stop offset="70%" stop-color="#1BAA80"/>
          <stop offset="100%" stop-color="#15B85F"/>
        </linearGradient>
      </defs>
      <defs>
        <linearGradient id="botGrad-mini" x1="0" y1="0" x2="0" y2="1">
          <stop offset="10%" stop-color="#1F7FB7"/>
          <stop offset="25%" stop-color="#2189B1"/>
          <stop offset="35%" stop-color="#20989D"/>
          <stop offset="70%" stop-color="#1BAA80"/>
          <stop offset="110%" stop-color="#15B85F"/>
        </linearGradient>
      </defs>
      <path d="M0,340 L0,140 C 140,50 250,230 430,120 L430,340 Z" fill="url(#botGrad)"/>
      <path d="M430,340 L430,220 C 380,190 400,270 340,340 Z" fill="url(#botGrad-mini)"/>
    </svg>

    <div class="content">

      <!-- Circular badge / logo -->
      <div class="badge-wrap" id="badgeBtn" role="button" tabindex="0" aria-label="Shine Rio Group - site oficial">
        <div class="badge">
          <img class="badge-photo" src="assets/perfil-shinerio.jpeg" alt="Shine Rio Group">
        </div>
      </div>

      <div class="spacer"></div>

      <!-- Action buttons -->
      <div class="actions">

        <div class="sector-select-wrap">
          <button class="action-btn sector-trigger" id="sectorTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="icon-circle">
              <svg viewBox="0 0 24 24"><path d="M4 7h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" stroke-width="2" stroke-linejoin="round"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" stroke-width="2"/></svg>
            </span>
            <span class="action-label" id="sectorLabel">SETOR OPERACIONAL</span>
            <span class="chevron" id="sectorChevron">
              <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </button>

          <ul class="sector-dropdown" id="sectorDropdown" role="listbox" aria-label="Selecionar setor">
            <li role="option" data-sector="supervisao" aria-selected="true">Setor Operacional</li>
            <li role="option" data-sector="comercial-privado">Comercial</li>
            <li role="option" data-sector="comercial-publico">Licitações e Contratos</li>
            <li role="option" data-sector="dp">Departamento Pessoal</li>
            <li role="option" data-sector="rh">Recursos Humanos</li>
          </ul>
        </div>

        <a class="action-btn" href="#" id="whatsappBtn" target="_blank" rel="noopener">
          <span class="icon-circle">
            <div class="whatsapp-icon">
  <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <path d="M16.001 0C7.164 0 0 7.163 0 16c0 2.822.738 5.58 2.14 8.006L0 32l8.213-2.144A15.94 15.94 0 0016 32c8.836 0 16-7.163 16-16S24.837 0 16.001 0zm0 29.267a13.23 13.23 0 01-6.74-1.847l-.484-.287-4.874 1.272 1.3-4.752-.315-.488A13.24 13.24 0 012.73 16C2.73 8.66 8.66 2.73 16 2.73S29.27 8.66 29.27 16 23.34 29.267 16.001 29.267zm7.29-9.933c-.399-.2-2.36-1.164-2.726-1.297-.366-.133-.632-.2-.898.2-.266.399-1.031 1.297-1.264 1.563-.233.266-.465.3-.864.1-.399-.2-1.685-.62-3.21-1.978-1.186-1.058-1.987-2.365-2.22-2.765-.233-.399-.025-.615.175-.814.18-.18.399-.465.598-.698.2-.233.266-.399.399-.665.133-.266.066-.499-.033-.698-.1-.2-.898-2.163-1.23-2.963-.324-.78-.653-.674-.898-.686l-.765-.014c-.266 0-.698.1-1.064.499-.366.399-1.397 1.365-1.397 3.328s1.43 3.86 1.63 4.126c.2.266 2.813 4.294 6.816 6.023.953.411 1.696.657 2.276.841.956.304 1.827.261 2.516.158.767-.115 2.36-.965 2.693-1.897.333-.932.333-1.73.233-1.897-.1-.166-.366-.266-.765-.465z" fill="#ffffff"/>
  </svg>
</div>

          </span>
          <span class="action-label" id="whatsappLabel">(21) 00000-0000</span>
        </a>

        <a class="action-btn" href="#" id="emailBtn">
          <span class="icon-circle">
            <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z" stroke-width="2" stroke-linejoin="round"/><path d="M3 7l9 6 9-6" stroke-width="2" stroke-linejoin="round"/></svg>
          </span>
          <span class="action-label" id="emailLabel">SUPERVISAO@SHINERIO.COM</span>
        </a>

        <a class="action-btn" href="#" id="instaBtn" target="_blank" rel="noopener">
          <span class="icon-circle">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.1" fill="#fff" stroke="none"/></svg>
          </span>
          <span class="action-label" id="instaLabel">@SHINERIO.GROUP</span>
        </a>

      </div>
    </div>

    <!-- Footer logo -->
    <footer class="footer">
    <div class="footer-content">
        <p>Acesse nosso site oficial</p>

        <a href="https://www.shinerio.com"
           target="_blank">
            www.shinerio.com
        </a>

        <span>© 2026 Shine Rio Group</span>
    </div>
</footer>

<!-- Toast feedback -->
<div class="toast" id="toast"></div>

<script src="script.js"></script>

</body>
</html>
